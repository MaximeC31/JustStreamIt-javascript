<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <title>JustStreamIt - Vidéos à la demande</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="p-6 max-w-screen-xl mx-auto">
      <div class="bg-slate-600 flex items-center gap-6 px-6 py-4 border border-black">
        <img src="./assets/logo.svg" alt="JustStreamIt Logo" class="w-20 h-20" />
        <h1 class="text-white text-3xl font-light">Vidéos à la demande</h1>
      </div>
    </header>

    <main>
      <!-- Meilleur film -->
      <section data-section="best-movie" class="p-6 max-w-screen-xl mx-auto">
        <h2 class="text-4xl font-semibold mb-4">Meilleur film</h2>
        <article class="items-start border-4 border-black bg-white p-6 flex flex-col md:flex-row gap-6">
          <figure class="w-1/3">
            <img src="" alt="" class="h-auto object-cover max-h-80 w-full" />
          </figure>
          <div class="w-2/3 flex flex-col justify-center gap-6">
            <h3 class="text-4xl font-semibold"></h3>
            <p class="text-2xl font-extralight"></p>
            <button class="bg-red-600 text-white rounded-full px-8 py-2 self-end">Détails</button>
          </div>
        </article>
      </section>

      <!-- Films les mieux notés -->
      <section class="p-6 max-w-screen-xl mx-auto">
        <h2 class="text-5xl font-semibold text-black mb-4">Films les mieux notés</h2>
        <div class="py-4 flex flex-col items-center">
          <div
            data-grid="top-rated"
            class="grid grid-cols-2 lg:grid-cols-3 md:[&>*:nth-child(n+5)]:hidden lg:[&>*:nth-child(n+5)]:block gap-6 w-full"
          ></div>
          <button data-more-btn class="bg-red-600 text-white rounded-full px-8 py-2 mt-4 lg:hidden">
            Voir plus
          </button>
        </div>
      </section>

      <!-- Catégorie 1 -->
      <section class="p-6 max-w-screen-xl mx-auto">
        <h2 class="text-5xl font-semibold text-black mb-4">Mystery</h2>
        <div class="py-4 flex flex-col items-center">
          <div
            data-grid="mystery"
            class="grid grid-cols-2 lg:grid-cols-3 md:[&>*:nth-child(n+5)]:hidden lg:[&>*:nth-child(n+5)]:block gap-6 w-full"
          ></div>
          <button data-more-btn class="bg-red-600 text-white rounded-full px-8 py-2 mt-4 lg:hidden">
            Voir plus
          </button>
        </div>
      </section>

      <!-- Catégorie 2 -->
      <section class="p-6 max-w-screen-xl mx-auto">
        <h2 class="text-5xl font-semibold text-black mb-4">Action</h2>
        <div class="py-4 flex flex-col items-center">
          <div
            data-grid="action"
            class="grid grid-cols-2 lg:grid-cols-3 md:[&>*:nth-child(n+5)]:hidden lg:[&>*:nth-child(n+5)]:block gap-6 w-full"
          ></div>
          <button data-more-btn class="bg-red-600 text-white rounded-full px-8 py-2 mt-4 lg:hidden">
            Voir plus
          </button>
        </div>
      </section>

      <!-- Autres catégories - Famille -->
      <section class="p-6 max-w-screen-xl mx-auto">
        <div class="flex items-center gap-4 mb-4">
          <h2 class="text-5xl font-semibold text-black">Autres :</h2>
          <select
            data-select="dynamic-1"
            class="border-2 border-black px-4 py-2 text-xl cursor-pointer"
          ></select>
        </div>
        <div class="py-4 flex flex-col items-center">
          <div
            data-grid="dynamic-1"
            class="grid grid-cols-2 lg:grid-cols-3 md:[&>*:nth-child(n+5)]:hidden lg:[&>*:nth-child(n+5)]:block gap-6 w-full"
          ></div>
          <button data-more-btn class="bg-red-600 text-white rounded-full px-8 py-2 mt-4 lg:hidden">
            Voir plus
          </button>
        </div>
      </section>

      <!-- Autres catégories - Comédies -->
      <section class="p-6 max-w-screen-xl mx-auto">
        <div class="flex items-center gap-4 mb-4">
          <h2 class="text-5xl font-semibold text-black">Autres :</h2>
          <select
            data-select="dynamic-2"
            class="border-2 border-black px-4 py-2 text-xl cursor-pointer"
          ></select>
        </div>
        <div class="py-4 flex flex-col items-center">
          <div
            data-grid="dynamic-2"
            class="grid grid-cols-2 lg:grid-cols-3 md:[&>*:nth-child(n+5)]:hidden lg:[&>*:nth-child(n+5)]:block gap-6 w-full"
          ></div>
          <button data-more-btn class="bg-red-600 text-white rounded-full px-8 py-2 mt-4 lg:hidden">
            Voir plus
          </button>
        </div>
      </section>
    </main>

    <!-- Modal -->
    <dialog
      data-modal="movie-details"
      class="bg-white border-4 border-black p-0 container lg:max-w-3xl relative"
    >
      <div class="p-8">
        <button data-close-modal class="absolute top-2 right-4 text-6xl text-red-600 lg:hidden">
          &times;
        </button>
        <div class="flex flex-col lg:flex-row gap-6 mb-6">
          <div class="w-full lg:w-2/3 flex flex-col gap-6">
            <h3 class="text-5xl font-bold"></h3>
            <div class="info">
              <p class="font-bold"></p>
              <p class="font-bold"></p>
              <p class="font-bold"></p>
              <p class="font-bold"></p>
            </div>
            <div class="directors">
              <p class="font-bold">Réalisé par:</p>
              <p></p>
            </div>
          </div>
          <figure class="hidden lg:block lg:w-1/3">
            <img src="" alt="Affiche film" class="w-full max-h-80 h-full object-cover" />
          </figure>
        </div>
        <p class="description mb-6"></p>
        <figure class="lg:hidden w-full flex justify-center my-6">
          <img src="" alt="Affiche film" class="max-h-80 object-cover" />
        </figure>
        <p class="font-bold">Avec:</p>
        <p class="actors mb-8"></p>
        <div class="hidden lg:flex justify-center">
          <button data-close-modal class="bg-red-600 text-white rounded-full px-8 py-2 text-xl">Fermer</button>
        </div>
      </div>
    </dialog>

    <!-- Template pour chaque films -->
    <template id="movie-template">
      <figure class="relative group cursor-pointer">
        <img
          src=""
          alt=""
          class="w-full object-cover transition-all duration-300 aspect-square cursor-default"
        />
        <div
          class="absolute top-1/4 p-4 flex flex-col gap-4 w-full bg-black bg-opacity-50 cursor-default"
        >
          <p class="text-white font-semibold text-2xl"></p>
          <button class="bg-gray-900 text-white rounded-full px-6 py-1 text-sm self-end">
            Détails
          </button>
        </div>
      </figure>
    </template>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
